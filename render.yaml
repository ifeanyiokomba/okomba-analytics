# ─────────────────────────────────────────────────────────────
# Render Blueprint — Okomba Analytics V2 (Stage 9 launch config)
# One-click full-stack deploy:
#   • web      — Next.js app + persistent SQLite disk (port 3000)
#   • whatsapp — whatsapp-web.js mini-service (Module 6) with its
#                own session disk; the app dispatches to it over the
#                private Render internal network. Express API on
#                3004, socket.io on 3005 (same process).
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Add custom domain (okomba.com + www) in
# Settings → Custom Domains AFTER first deploy. Render issues free
# Let's Encrypt SSL automatically.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: okomba-analytics
    runtime: node
    plan: starter
    region: frankfurt # closest to Nigeria among Render regions
    buildCommand: npm install && npx prisma generate && npm run build
    # NOTE: startCommand runs prisma via `node ./node_modules/prisma/build/index.js`
    # instead of `npx prisma`. In Docker-based deploys the Dockerfile's own
    # ENTRYPOINT (docker-entrypoint.sh) runs first and `exec`s the server, so
    # this startCommand is effectively a fallback — kept in sync defensively.
    # Calling prisma's entrypoint JS directly keeps `__dirname` =
    # `node_modules/prisma/build/`, which is where the wasm files live, so
    # Prisma's runtime lookup of `prisma_schema_build_bg.wasm` succeeds. (With
    # `npx prisma`, Docker's COPY dereferenced the .bin/prisma symlink into a
    # regular file and the wasm lookup failed with ENOENT.)
    startCommand: node ./node_modules/prisma/build/index.js db push --skip-generate && (node scripts/seed-testimonials.mjs || true) && exec node .next/standalone/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ── Phase 28: Neon PostgreSQL (was SQLite on /data disk) ──
      # Set BOTH env vars in the Render dashboard after first deploy:
      #   DATABASE_URL  = pooled Neon URL (…-pooler…?…&pgbouncer=true&connection_limit=1)
      #   DIRECT_URL    = direct Neon URL (no -pooler, no pgbouncer) — for migrations
      # The persistent /data disk below is kept for snapshot-style backups
      # (the admin Backups tab still writes a local SQLite dump there as a
      # fallback when Drive isn't configured). The main DB is now external.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── Public site URLs (Stage 9A — domain okomba.com) ──
      - key: NEXT_PUBLIC_SITE_URL
        value: https://okomba.com
      - key: PORTAL_BASE_URL
        value: https://okomba.com
      # ── Email notifications (Google Apps Script Web App) ──
      # Deploy Google-apps-script/Code.gs, paste the /exec URL.
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      - key: NOTIFICATIONS_ENABLED
        value: "true"
      # ── WhatsApp mini-service (Module 6/7) — internal URL of the
      #    service below on Render's private network:
      - key: WHATSAPP_SERVICE_URL
        value: http://okomba-whatsapp:3004
      # ── Secrets — set in Render dashboard after first deploy ──
      # (Blueprint files are public in the repo — never put real
      # secrets here). sync:false keeps them out of GIT-synced pulls.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_INTERNAL_TOKEN
        sync: false
      # ── Paystack (Stage 9A — LIVE mode) ──
      # Same secret key you set in the Paystack dashboard webhook
      # page (https://dashboard.paystack.com/#/settings/webhooks).
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # ── Cloudinary (Module 8B) — proposal PDF storage ──
      # Preferred form: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
      # ── Google Drive daily backup (Module 8B) ──
      # Service account JSON (the full file contents) + the Drive
      # folder ID where backups land. The hand-rolled JWT path in
      # src/lib/backup.ts accepts either raw JSON or base64-encoded.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: BACKUP_CRON_ENABLED
        value: "true"
      # ── GA4 (Module 8C) — measurement ID G-XXXX ──
      - key: NEXT_PUBLIC_GA4_MEASUREMENT_ID
        sync: false
      # ── Google Apps Script sheet (legacy — Google Sheet writeback) ──
      - key: GOOGLE_SCRIPT_URL
        sync: false
    disk:
      name: okomba-local-cache
      mountPath: /data
      sizeGB: 1

  # ── WhatsApp mini-service (Module 6) ──────────────────────
  # whatsapp-web.js + Express :3004 + socket.io :3005. The QR is
  # scanned from the admin WhatsApp tab; the browser session lives
  # on the dedicated disk so it survives deploys/restarts.
  - type: web
    name: okomba-whatsapp
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: whatsapp-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_PORT
        value: "3004"
      - key: SOCKET_PORT
        value: "3005"
      - key: WHATSAPP_MODE
        value: auto
      # The main app's public URL (inbound messages + service events
      # are POSTed here with this shared token):
      - key: MAIN_APP_URL
        value: http://okomba-analytics:3000
      - key: WHATSAPP_INTERNAL_TOKEN
        sync: false
    disk:
      name: okomba-whatsapp-session
      mountPath: /data
      sizeGB: 1
