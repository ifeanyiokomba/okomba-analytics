<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
   viewBox="0 0 100 100" style="enable-background:new 0 0 100 100;" xml:space="preserve">
  <defs>
    <style type="text/css">
      .badge-bg { fill: #0B0F1A; }
      .badge-stroke { fill: none; stroke: #F0A500; stroke-opacity: 0.55; stroke-width: 1.6; }
      .wordmark {
        fill: #FFFFFF;
        font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.4px;
      }
      .analytics-cap {
        fill: #B8B8C8;
        font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 6.5px;
        letter-spacing: 2.2px;
      }
      .dot { fill: #F0A500; }
      .dot-shadow { fill: #F0A500; opacity: 0.35; }

      .z-breathe {
        animation: breathe 2.5s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.7; }
        50%      { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Brand squircle badge -->
  <rect class="badge-bg" x="3" y="3" width="94" height="94" rx="22" ry="22" />
  <rect class="badge-stroke" x="3.8" y="3.8" width="92.4" height="92.4" rx="21.2" ry="21.2" />

  <!-- Okomba wordmark (Georgia serif, white) -->
  <text class="wordmark" x="50" y="52" text-anchor="middle">Okomba</text>

  <!-- Italic ANALYTICS caption -->
  <text class="analytics-cap" x="50" y="68" text-anchor="middle">ANALYTICS</text>

  <!-- Gold dot accent with z-breathe pulse -->
  <circle class="dot-shadow z-breathe" cx="80" cy="20" r="6.5" />
  <circle class="dot" cx="80" cy="20" r="4" />
</svg>
